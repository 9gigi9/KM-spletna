<div class="tickets-wrapper">
  <div class="tickets-container">
    @for (ticket of eventService.events$ | async; track ticket) {
      <app-ticket-card
        [title]="ticket.title"
        [date]="ticket.date"
        [time]="ticket.time"
        [imgUrl]="ticket.imgUrl"
        (click)="goToEventDetails(ticket.id)"
      ></app-ticket-card>
    }
  </div>
</div>
