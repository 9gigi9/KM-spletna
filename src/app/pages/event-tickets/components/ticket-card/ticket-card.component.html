<div class="ticket-card">
  <img
    [src]="imgUrl"
    alt="Slika kviza"
    class="ticket-image"
  />

  <div class="ticket-content">
    <h3 class="title">{{ title }}</h3>
    <div >
      <p class="date-time">{{ date }} • {{ time }}</p>
    </div>
  </div>

</div>
