<div class="tickets-wrapper">
  <div class="tickets-container">
    <app-ticket-card
      *ngFor="let ticket of eventService.events$ | async"
      [title]="ticket.title"
      [date]="ticket.date"
      [time]="ticket.time"
      [imgUrl]="ticket.imgUrl"
      (click)="goToEventDetails(ticket.id)"
    ></app-ticket-card>
  </div>
</div>
